name: time_movies_app
description: Offline-first personal movie and series library.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
